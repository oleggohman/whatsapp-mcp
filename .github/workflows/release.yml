# Actions are pinned to release tags and bumped by dependabot (.github/dependabot.yml).
# Follow-up: pin them to full commit SHAs (dependabot keeps SHA pins up to date too).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-15, goos: darwin, goarch: arm64 }
          - { os: macos-15-intel, goos: darwin, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum

      - name: Test
        working-directory: whatsapp-bridge
        run: go test -count=1 ./...

      - name: Build
        working-directory: whatsapp-bridge
        env:
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.bridgeVersion=${GITHUB_REF_NAME}"
          -o "whatsapp-bridge${EXT}"

      - name: Package
        env:
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
          NAME: whatsapp-mcp-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          # Tracked sources only (no local stores, venvs or caches).
          git archive --format=tar --prefix="${NAME}/" HEAD \
            whatsapp-bridge whatsapp-mcp-server README.md LICENSE | tar -x -C stage
          mv "whatsapp-bridge/whatsapp-bridge${EXT}" "stage/${NAME}/whatsapp-bridge/"
          # bridge_manager rebuilds when sources are newer than the binary: keep the binary newest.
          touch "stage/${NAME}/whatsapp-bridge/whatsapp-bridge${EXT}"
          # One .zip per platform. Info-ZIP keeps the Unix executable bit; Windows runners use 7z.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd stage && 7z a -tzip "../dist/${NAME}.zip" "${NAME}" > /dev/null)
          else
            (cd stage && zip -qry "../dist/${NAME}.zip" "${NAME}")
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The section between "## [<version>]" and the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          printf '\n**Full changelog:** [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
          cat notes.md
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.4
        with:
          body_path: notes.md
          files: |
            dist/*.zip
            dist/SHA256SUMS
