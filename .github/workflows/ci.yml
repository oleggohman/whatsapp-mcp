# Actions are pinned to release tags and bumped by dependabot (.github/dependabot.yml).
# Follow-up: pin them to full commit SHAs (dependabot keeps SHA pins up to date too).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        shell: bash
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        if: runner.os != 'Windows'
      # The release workflow tests on Windows too; catch breaks here before a tag is pushed.
      - run: go test -count=1 ./...
        if: runner.os == 'Windows'
      - name: Coverage gate (100%)
        if: runner.os != 'Windows' # Unix-only files (lock, signals) are not built there
        run: bash scripts/coverage.sh

  golangci-lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: whatsapp-bridge

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: whatsapp-mcp-server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests + coverage gate (100%)
        run: uv run pytest -q --cov --cov-report=term-missing

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
